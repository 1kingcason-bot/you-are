# Render Blueprint — one-click deploy of the you are platform
services:
  - type: web
    name: you-are
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Backblaze B2 object storage (set these in the Render dashboard)
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        sync: false
